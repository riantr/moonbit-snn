name: publish

# Tag-driven only. Releases are never published from a branch or by hand:
# a tag that exists is a release request, and the gates below decide whether it
# actually happens.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    # Pinned, not `ubuntu-latest`. The floating label migrates to Ubuntu 26 on
    # 2026-10-19, and a release toolchain should not change under you between
    # two tags of the same package.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mbt
    steps:
      - uses: actions/checkout@v4

      - name: Install moon
        run: |
          # NOTE the path is install/unix.sh, not install.sh. Getting that wrong
          # 403s, and piping into `bash` then HIDES it: bash exits 0 on empty
          # stdin, so the step goes green and the next step fails with a
          # misleading "moon: command not found". Hence the explicit verify.
          # cli.moonbitlang.com is what MoonBit's own CI uses; the .cn mirror is
          # a fallback for when the .com host is unreachable from a runner.
          { curl -fsSL https://cli.moonbitlang.com/install/unix.sh \
            || curl -fsSL https://cli.moonbitlang.cn/install/unix.sh; } \
            > /tmp/moon-install.sh
          test -s /tmp/moon-install.sh
          bash /tmp/moon-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify moon is on PATH
        run: |
          # The install step cannot be trusted on its own exit code (see above),
          # so the next step proves the binary is really there before anything
          # depends on it.
          moon version --all

      # A fresh runner's registry index is empty, and this module imports
      # riantr/moonbit_image and moonbit-community/sqlite3 from mooncakes.io.
      # Without this, the gates below fail with "Failed to resolve registry
      # dependency" before a single file is checked.
      - name: Resolve the registry index
        run: moon update

      # The single most useful guard in this workflow. A tag that disagrees
      # with moon.mod publishes the wrong thing silently: moon publishes
      # whatever version moon.mod says, and the tag is just a label nobody
      # checks against it.
      - name: Resolve and check the release version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${REF_NAME#v}"
          got=$(sed -n 's/^version = "\(.*\)"$/\1/p' moon.mod)
          echo "tag says  : $want"
          echo "moon.mod says: $got"
          if [ "$got" != "$want" ]; then
            echo "::error file=moon.mod::version is '$got', the tag says '$want'."
            echo "::error::the registry publishes moon.mod's value, not the tag's."
            exit 1
          fi
          echo "version=$got" >> "$GITHUB_OUTPUT"

      # `typos` is checked before anything expensive because it has historically
      # been the step that actually fails in this repo -- the token has usually
      # been fine and the typo gate has not. Cheap to run, so run it first.
      - name: Check typos
        uses: crate-ci/typos@master

      - name: moon check
        # `--target native`, not `--target all`. This package is native-only by
        # design: `math_native.mbt` and friends bind libm directly through
        # `extern "C"`, and moon.mod declares `preferred_target = "native"`.
        # Asking for every target cannot even build a plan -- it fails on Wasm,
        # WasmGC and Js before a single file is checked.
        run: moon check --target native

      # The root package cannot host a test target at all: moon inlines every
      # source path into the Windows command line and the package exceeds the
      # 32K limit, so `moon test` on the root dies with
      # CreateProcessW ERROR_FILENAME_EXCED_RANGE. The consequence is easy to
      # miss and worse than a red build: a `*_test.mbt` left in the root is not
      # a failing test, it is a test that never runs and still reports green.
      #
      # So the failure mode is inverted here -- the guard passes only when the
      # root is clean. It started as `continue-on-error` while 207 root tests
      # were still being moved into tests/waveN/; the root is empty now, so a
      # new `*_test.mbt` there is a genuine regression and fails the build.
      - name: Guard against unrunnable root-package tests
        run: |
          cd mbt
          leftover=$(ls *_test.mbt 2>/dev/null | wc -l)
          if [ "$leftover" -ne 0 ]; then
            echo "::error::${leftover} 个 *_test.mbt 留在根包，它们不会被 CI 执行"
            echo "根包 moon test 撞 Win32 CreateProcessW 32K 上限，无法链接。"
            echo "请移入 tests/waveN/ 子包 —— 工具与说明见 tools/split_tests/README.md"
            ls *_test.mbt
            exit 1
          fi
          echo "根包无残留测试文件。"

      # `moon fmt --check` is deliberately NOT a gate. The package has ~998
      # files and ten of them carry pre-existing formatting diffs that predate
      # any of this work; enabling the check now would fail a release over
      # unrelated files, and mass-reformatting them inside a release commit is
      # scope creep. Worth doing as its own commit, then the gate can come
      # back.

      # NOT `moon test` on the root package. It fails with CreateProcessW
      # ERROR_FILENAME_EXCED_RANGE (the 32K Windows command-line limit) because
      # moon inlines every source path. The test sub-packages are the supported
      # entry points.
      #
      # Every `*_test.mbt` now lives in one of these. The root is empty of tests,
      # so the guard above passes for real rather than by exemption, and
      # `continue-on-error` can come off.
      - name: moon test wave1
        run: moon test ./tests/wave1 --target native

      - name: moon test wave2
        run: moon test ./tests/wave2 --target native

      # Waves 3-9 hold the tests that used to sit in the root package and never
      # ran at all: 207 files covering the neuron models, recurrent/RL, synapse
      # plasticity and the remaining DL surface. wave8 additionally imports
      # riantr/moonbit_image because `image_test.mbt` decodes a BMP through it.
      - name: moon test wave3
        run: moon test ./tests/wave3 --target native

      - name: moon test wave4
        run: moon test ./tests/wave4 --target native

      - name: moon test wave5
        run: moon test ./tests/wave5 --target native

      - name: moon test wave6
        run: moon test ./tests/wave6 --target native

      - name: moon test wave7
        run: moon test ./tests/wave7 --target native

      - name: moon test wave8
        run: moon test ./tests/wave8 --target native

      - name: moon test wave9
        run: moon test ./tests/wave9 --target native

      # The secret must be the ENTIRE contents of ~/.moon/credentials.json
      # as JSON -- not a bare token. `moon publish` reads that file, and a file
      # holding only the token cannot authenticate: it fails with the same
      # opaque non-zero exit as a rejected upload, which is why the shape is
      # checked here instead of being taken on trust.
      - name: Write mooncakes credentials
        env:
          MOON_CAKES_CREDENTIALS: ${{ secrets.MOONCAKES_RIANTR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$MOON_CAKES_CREDENTIALS" ]; then
            echo "::error::MOONCAKES_RIANTR_TOKEN is not set on this repository."
            echo "::error::moon publish cannot authenticate. Nothing was published."
            exit 1
          fi
          mkdir -p "$HOME/.moon"
          printf '%s' "$MOON_CAKES_CREDENTIALS" > "$HOME/.moon/credentials.json"
          python3 - <<'PY'
          import json, os, sys
          path = os.path.expanduser("~/.moon/credentials.json")
          try:
              with open(path, encoding="utf-8") as fh:
                  doc = json.load(fh)
          except Exception as exc:
              print(f"::error::the secret is not valid JSON: {exc}")
              sys.exit(1)
          if not isinstance(doc, dict) or not doc.get("token"):
              print("::error::the secret has no non-empty 'token' field")
              sys.exit(1)
          # Key names and the token's length only. Never its value.
          print("credentials valid: keys=" + str(sorted(doc.keys())) +
                " token length=" + str(len(doc["token"])))
          PY

      # `moon publish --dry-run` really authenticates (a bad token yields
      # "Server status: 401 Unauthorized, detail: Invalid API token") but has
      # no registry side effects, so a credential failure is caught here
      # rather than half way through a publish.
      #
      # The exit code is NOT a signal. Measured on moon 0.1.20261016 against
      # mooncakes.io with a working token, a fully successful dry run prints
      #
      #     Check passed
      #     Server status: 202 Accepted, detail: Dry run completed
      #     successfully. No changes were made. ...
      #     Error: `moon publish` failed
      #
      # and still exits non-zero: the CLI appears to read the dry run's "no
      # changes" state as a failed publish. So the exit code is discarded and
      # the decision is made on the server's own response text, which does
      # distinguish the two cases.
      #
      # `2>&1` matters -- this CLI writes these lines to stderr, so a
      # stdout-only capture would see an empty log and fail the grep.
      - name: Verify credentials (dry run)
        run: |
          set -uo pipefail
          moon publish --dry-run --verbose 2>&1 | tee dryrun.log || true
          if grep -q "Server status: 202 Accepted" dryrun.log; then
            echo "credentials accepted by the server (dry run, no side effects)"
          else
            echo "::error::the dry run did not confirm credentials with the server"
            grep -E "Server status|Error" dryrun.log || echo "(no server response in the log)"
            exit 1
          fi

      - name: Publish to mooncakes.io
        run: |
          set -uo pipefail
          # The credentials file is removed when this step ends, on success and
          # on failure alike. It must NOT be removed at the end of the step
          # that writes it: the dry run above reads the same file, and a trap
          # there deletes it before the dry run gets to it.
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          moon publish --verbose 2>&1 | tee publish.log \
            || echo "::warning::moon publish exited $? - the registry check below is authoritative"

      # The authority for whether anything actually landed. It reads
      # mooncakes.io with no credentials at all, so it cannot be fooled by a
      # publish command that reported success or failure.
      #
      # `grep -qx`, not `grep`: the match is anchored to a whole line because
      # `moon view --versions` prints one version per line, and an unanchored
      # substring match is the exact failure this workflow exists to prevent
      # -- checking for `0.166.0` would also match `0.166.01`.
      - name: Verify the version is on the registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "published versions of riantr/snn_mbt:"
          moon view riantr/snn_mbt --versions
          if moon view riantr/snn_mbt --versions | grep -qx "$VERSION"; then
            echo "::notice::$VERSION is live on mooncakes.io"
          else
            echo "::error::$VERSION does not appear in the registry listing above"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true